# 仓库与运行时关系摘要；具体数据模型以代码和数据库迁移为准。
service: interviewflash-web
display_name: InterviewFlash Web 应用
domain: interview-preparation-and-job-search
role: react-spa
runtime:
  frontend: Vite static application
  backend: Supabase managed services
capabilities:
  - 闪卡练习与学习进度
  - 面经记录与同步
  - 简历与 AI 辅助工具
  - 校招岗位浏览与跟踪
local_persistence:
  - Zustand stores using localStorage
  - Interview records using IndexedDB with a localStorage fallback
cloud_capabilities:
  - Supabase Auth
  - User data synchronization
  - Edge Functions for AI and server-side operations
