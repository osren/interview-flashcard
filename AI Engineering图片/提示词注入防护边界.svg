<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{rx:17;stroke-width:2}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="620" rx="28" fill="#f8fafc"/><text x="550" y="55" text-anchor="middle" class="t">提示词注入防护：把不可信输入关在权限边界内</text><rect x="65" y="150" width="230" height="110" class="b" fill="#fff7ed" stroke="#fb923c"/><text x="180" y="192" text-anchor="middle" class="h">用户 / 检索内容</text><text x="180" y="225" text-anchor="middle" class="s">可能包含恶意指令</text><rect x="360" y="150" width="230" height="110" class="b" fill="#eef2ff" stroke="#818cf8"/><text x="475" y="192" text-anchor="middle" class="h">输入标记与隔离</text><text x="475" y="225" text-anchor="middle" class="s">内容是数据，不是系统规则</text><rect x="655" y="150" width="230" height="110" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="770" y="192" text-anchor="middle" class="h">最小权限工具</text><text x="770" y="225" text-anchor="middle" class="s">允许清单 / 参数校验</text><rect x="360" y="365" width="230" height="110" class="b" fill="#fef3c7" stroke="#fbbf24"/><text x="475" y="407" text-anchor="middle" class="h">策略与输出检查</text><text x="475" y="440" text-anchor="middle" class="s">敏感信息 / 越权动作拦截</text><rect x="655" y="365" width="230" height="110" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="770" y="407" text-anchor="middle" class="h">人工确认与审计</text><text x="770" y="440" text-anchor="middle" class="s">高影响操作二次确认</text><path d="M295 205H350M590 205H645M770 260V355M655 420H600" class="a"/><path d="M475 260V355" class="a"/><rect x="930" y="150" width="115" height="325" rx="18" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="987" y="205" text-anchor="middle" class="h">不可</text><text x="987" y="240" text-anchor="middle" class="h">直接</text><text x="987" y="275" text-anchor="middle" class="h">信任</text><text x="987" y="325" text-anchor="middle" class="s">外部文本</text><text x="987" y="355" text-anchor="middle" class="s">中的指令</text><text x="550" y="555" text-anchor="middle" class="s">提示词只能提供一层防护；真正的安全边界由应用权限、校验与确认流程实现</text></svg>
