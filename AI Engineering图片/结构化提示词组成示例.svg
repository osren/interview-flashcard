<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{rx:16;stroke-width:2}</style></defs><rect width="1100" height="620" rx="28" fill="#f8fafc"/><text x="550" y="55" text-anchor="middle" class="t">结构化提示词：把任务说明拆成可检查的模块</text><rect x="65" y="115" width="430" height="115" class="b" fill="#eef2ff" stroke="#818cf8"/><text x="95" y="153" class="h">① 角色与目标</text><text x="95" y="184" class="s">你是谁？要完成什么？面向谁？</text><text x="95" y="209" class="s">例：你是资深客服助手，负责回答订单问题。</text><rect x="605" y="115" width="430" height="115" class="b" fill="#ede9fe" stroke="#a78bfa"/><text x="635" y="153" class="h">② 上下文与资料</text><text x="635" y="184" class="s">提供必要事实、术语、用户输入。</text><text x="635" y="209" class="s">明确哪些内容可信、哪些只是待处理输入。</text><rect x="65" y="270" width="430" height="115" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="95" y="308" class="h">③ 规则与边界</text><text x="95" y="339" class="s">必须做什么、禁止做什么、何时拒答？</text><text x="95" y="364" class="s">例：证据不足时说明未知，不猜测订单状态。</text><rect x="605" y="270" width="430" height="115" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="635" y="308" class="h">④ 示例与输出格式</text><text x="635" y="339" class="s">给一两个高质量范例，规定字段和格式。</text><text x="635" y="364" class="s">例：仅输出 JSON：{ status, explanation }。</text><rect x="200" y="445" width="700" height="90" rx="20" fill="#172033"/><text x="550" y="482" text-anchor="middle" style="font:700 21px 'Microsoft YaHei';fill:#fff">清晰指令 + 相关上下文 + 明确边界 + 可验证输出</text><text x="550" y="512" text-anchor="middle" style="font:16px 'Microsoft YaHei';fill:#cbd5e1">示例用于对齐意图与格式；复杂任务可拆步并逐步校验</text></svg>
