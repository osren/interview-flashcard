<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:600}.small{font-size:16px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1000" height="680" rx="28" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" class="title">Agent 的 ReAct：思考、行动、观察、再决策</text>
<rect x="355" y="95" width="290" height="82" class="box" fill="#ede9fe" stroke="#8b5cf6"/><text x="500" y="130" text-anchor="middle" class="label">用户目标</text><text x="500" y="157" text-anchor="middle" class="small">提供目标与边界</text>
<rect x="355" y="230" width="290" height="92" class="box" fill="#fff" stroke="#8b5cf6"/><text x="500" y="268" text-anchor="middle" class="label">模型判断（Thought）</text><text x="500" y="297" text-anchor="middle" class="small">继续回答？还是需要工具？</text>
<rect x="90" y="405" width="290" height="100" class="box" fill="#dbeafe" stroke="#3b82f6"/><text x="235" y="445" text-anchor="middle" class="label">调用工具（Action）</text><text x="235" y="475" text-anchor="middle" class="small">搜索 / API / 代码执行</text>
<rect x="620" y="405" width="290" height="100" class="box" fill="#dcfce7" stroke="#22c55e"/><text x="765" y="445" text-anchor="middle" class="label">读取结果（Observation）</text><text x="765" y="475" text-anchor="middle" class="small">校验结果并补充上下文</text>
<rect x="355" y="555" width="290" height="78" class="box" fill="#fef3c7" stroke="#f59e0b"/><text x="500" y="589" text-anchor="middle" class="label">最终回答 / 安全终止</text><text x="500" y="615" text-anchor="middle" class="small">达到目标或触发边界</text>
<path d="M500 177V220 M425 322L270 395 M575 322L730 395 M380 455H610 M765 505C765 545 665 580 655 590 M355 595C180 595 125 550 125 510" class="arrow"/>
<text x="290" y="355" class="small">要行动</text><text x="640" y="355" class="small">可直接回答</text><text x="490" y="535" class="small">结果回灌，进入下一轮判断</text><text x="500" y="660" text-anchor="middle" class="small">治理：最大步数、超时、工具权限、参数校验、人工确认与完整日志</text></svg>
