<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{rx:18;stroke-width:2}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="630" rx="28" fill="#f8fafc"/><text x="550" y="55" text-anchor="middle" class="t">知识更新、私有事实还是行为风格？据此选择方案</text><path d="M550 110L675 205L550 300L425 205Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="550" y="194" text-anchor="middle" class="h">主要问题是什么？</text><text x="550" y="222" text-anchor="middle" class="s">需要新知识，还是改变模型行为？</text><rect x="65" y="390" width="285" height="145" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="207" y="430" text-anchor="middle" class="h">知识常更新 / 需要引用</text><text x="207" y="467" text-anchor="middle" class="h">→ 优先 RAG</text><text x="207" y="500" text-anchor="middle" class="s">知识外置、可检索、易更新</text><rect x="408" y="390" width="285" height="145" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="550" y="430" text-anchor="middle" class="h">输出风格 / 格式 / 技能稳定</text><text x="550" y="467" text-anchor="middle" class="h">→ 考虑微调</text><text x="550" y="500" text-anchor="middle" class="s">需要高质量示例与训练评估</text><rect x="750" y="390" width="285" height="145" class="b" fill="#ede9fe" stroke="#a78bfa"/><text x="892" y="430" text-anchor="middle" class="h">兼具领域知识与行为适配</text><text x="892" y="467" text-anchor="middle" class="h">→ RAG + 微调</text><text x="892" y="500" text-anchor="middle" class="s">先分别验证，再组合引入</text><path d="M480 275L207 380M550 300V380M620 275L892 380" class="a"/><text x="550" y="580" text-anchor="middle" class="s">先检查提示词、检索和基准模型是否足够；微调不能替代实时知识库</text></svg>
