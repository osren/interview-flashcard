<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="650" rx="28" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" class="title">RAG：离线建库 + 在线检索生成</text>
<rect x="55" y="95" width="1090" height="205" rx="22" fill="#eef2ff"/><text x="85" y="130" class="label" fill="#4338ca">离线：准备知识</text>
<rect x="80" y="165" width="190" height="85" class="box" fill="#fff" stroke="#818cf8"/><text x="175" y="200" text-anchor="middle" class="label">原始文档</text><text x="175" y="228" text-anchor="middle" class="small">PDF / 网页 / 数据</text>
<rect x="350" y="165" width="190" height="85" class="box" fill="#fff" stroke="#818cf8"/><text x="445" y="200" text-anchor="middle" class="label">解析与切片</text><text x="445" y="228" text-anchor="middle" class="small">保留语义边界</text>
<rect x="620" y="165" width="190" height="85" class="box" fill="#fff" stroke="#818cf8"/><text x="715" y="200" text-anchor="middle" class="label">Embedding</text><text x="715" y="228" text-anchor="middle" class="small">文本 → 向量</text>
<rect x="890" y="165" width="210" height="85" class="box" fill="#fff" stroke="#818cf8"/><text x="995" y="200" text-anchor="middle" class="label">向量库 + 元数据</text><text x="995" y="228" text-anchor="middle" class="small">索引 / 权限 / 来源</text>
<path d="M270 207H340 M540 207H610 M810 207H880" class="arrow"/>
<rect x="55" y="335" width="1090" height="250" rx="22" fill="#ecfdf5"/><text x="85" y="372" class="label" fill="#047857">在线：回答问题</text>
<rect x="80" y="415" width="175" height="95" class="box" fill="#fff" stroke="#34d399"/><text x="167" y="452" text-anchor="middle" class="label">用户问题</text><text x="167" y="481" text-anchor="middle" class="small">可附过滤条件</text>
<rect x="315" y="415" width="175" height="95" class="box" fill="#fff" stroke="#34d399"/><text x="402" y="452" text-anchor="middle" class="label">向量化查询</text><text x="402" y="481" text-anchor="middle" class="small">同一 Embedding</text>
<rect x="550" y="415" width="175" height="95" class="box" fill="#fff" stroke="#34d399"/><text x="637" y="452" text-anchor="middle" class="label">召回 + 重排</text><text x="637" y="481" text-anchor="middle" class="small">相关片段与权限</text>
<rect x="785" y="415" width="175" height="95" class="box" fill="#fff" stroke="#34d399"/><text x="872" y="452" text-anchor="middle" class="label">组装上下文</text><text x="872" y="481" text-anchor="middle" class="small">片段 + 引用来源</text>
<rect x="1020" y="415" width="95" height="95" class="box" fill="#d1fae5" stroke="#10b981"/><text x="1067" y="452" text-anchor="middle" class="label">生成</text><text x="1067" y="481" text-anchor="middle" class="small">答案</text>
<path d="M255 462H305 M490 462H540 M725 462H775 M960 462H1010" class="arrow"/><path d="M995 250V360H637V405" class="arrow"/><text x="820" y="350" class="small">检索候选片段</text>
<text x="600" y="625" text-anchor="middle" class="small">质量抓手：切片边界、召回与重排、上下文相关性、引用忠实度</text></svg>
