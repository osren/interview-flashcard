<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:15px;fill:#475569}.box{rx:17;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="570" rx="28" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" class="title">Function Calling：模型提出调用，应用执行并回传</text>
<rect x="50" y="185" width="180" height="110" class="box" fill="#eef2ff" stroke="#818cf8"/><text x="140" y="225" text-anchor="middle" class="label">1. 用户请求</text><text x="140" y="256" text-anchor="middle" class="small">“查询订单状态”</text>
<rect x="285" y="185" width="190" height="110" class="box" fill="#ede9fe" stroke="#a78bfa"/><text x="380" y="225" text-anchor="middle" class="label">2. 模型选择工具</text><text x="380" y="256" text-anchor="middle" class="small">按 Schema 生成参数</text>
<rect x="530" y="185" width="190" height="110" class="box" fill="#dbeafe" stroke="#60a5fa"/><text x="625" y="225" text-anchor="middle" class="label">3. 应用校验执行</text><text x="625" y="256" text-anchor="middle" class="small">鉴权 / 参数校验 / 调用</text>
<rect x="775" y="185" width="175" height="110" class="box" fill="#dcfce7" stroke="#4ade80"/><text x="862" y="225" text-anchor="middle" class="label">4. 工具结果</text><text x="862" y="256" text-anchor="middle" class="small">成功数据或错误</text>
<rect x="1000" y="185" width="160" height="110" class="box" fill="#fef3c7" stroke="#fbbf24"/><text x="1080" y="225" text-anchor="middle" class="label">5. 最终回答</text><text x="1080" y="256" text-anchor="middle" class="small">基于执行结果</text>
<path d="M230 240H275 M475 240H520 M720 240H765 M950 240H990" class="arrow"/>
<rect x="285" y="380" width="665" height="90" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="617" y="416" text-anchor="middle" class="label">MCP 可标准化工具的发现与接入</text><text x="617" y="447" text-anchor="middle" class="small">MCP Server 暴露工具 → Host / Client 接入 → 转成模型可用 Schema → 执行结果回传</text>
<path d="M862 305V340H625V295 M380 305V370" class="arrow"/><text x="740" y="335" class="small">把结果回填模型；若仍需工具，可继续一轮</text>
<text x="600" y="525" text-anchor="middle" class="small">关键边界：模型只提出调用意图；真实权限检查、执行与高危操作确认由应用负责</text></svg>
