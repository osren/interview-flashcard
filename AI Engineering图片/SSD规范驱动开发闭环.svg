<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px;fill:#475569}.b{rx:18;stroke-width:2}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="620" rx="28" fill="#f8fafc"/><text x="550" y="55" text-anchor="middle" class="t">SSD：从需求到可验证交付的闭环</text><rect x="80" y="150" width="210" height="115" class="b" fill="#eef2ff" stroke="#818cf8"/><text x="185" y="193" text-anchor="middle" class="h">1. 澄清需求</text><text x="185" y="225" text-anchor="middle" class="s">目标、范围、边界</text><rect x="445" y="150" width="210" height="115" class="b" fill="#ede9fe" stroke="#a78bfa"/><text x="550" y="193" text-anchor="middle" class="h">2. 编写规范</text><text x="550" y="225" text-anchor="middle" class="s">约束 + 验收标准</text><rect x="810" y="150" width="210" height="115" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="915" y="193" text-anchor="middle" class="h">3. 校验与评审</text><text x="915" y="225" text-anchor="middle" class="s">查歧义、查遗漏</text><rect x="810" y="380" width="210" height="115" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="915" y="423" text-anchor="middle" class="h">4. 生成实现</text><text x="915" y="455" text-anchor="middle" class="s">代码、测试、文档</text><rect x="445" y="380" width="210" height="115" class="b" fill="#fef3c7" stroke="#fbbf24"/><text x="550" y="423" text-anchor="middle" class="h">5. 按规范验收</text><text x="550" y="455" text-anchor="middle" class="s">测试结果对照标准</text><rect x="80" y="380" width="210" height="115" class="b" fill="#fff7ed" stroke="#fb923c"/><text x="185" y="423" text-anchor="middle" class="h">6. 更新规范</text><text x="185" y="455" text-anchor="middle" class="s">记录变更与决策</text><path d="M290 207H435M655 207H800M915 265V370M810 437H665M445 437H300" class="a"/><path d="M185 380V320H550V275" class="a"/><text x="550" y="570" text-anchor="middle" class="s">规范是人和 AI 共同遵循、可版本管理的交付契约</text></svg>
