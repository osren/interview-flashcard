<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{rx:17;stroke-width:2}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="620" rx="28" fill="#f8fafc"/><text x="550" y="55" text-anchor="middle" class="t">上下文管理：先筛选，再组织，最后压缩</text><rect x="55" y="135" width="220" height="130" class="b" fill="#eef2ff" stroke="#818cf8"/><text x="165" y="180" text-anchor="middle" class="h">原始信息池</text><text x="165" y="213" text-anchor="middle" class="s">当前问题 / 历史对话</text><text x="165" y="240" text-anchor="middle" class="s">文档 / 工具结果 / 记忆</text><rect x="350" y="135" width="220" height="130" class="b" fill="#ede9fe" stroke="#a78bfa"/><text x="460" y="180" text-anchor="middle" class="h">相关性筛选</text><text x="460" y="213" text-anchor="middle" class="s">检索最相关片段</text><text x="460" y="240" text-anchor="middle" class="s">删除重复与过期内容</text><rect x="645" y="135" width="220" height="130" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="755" y="180" text-anchor="middle" class="h">优先级编排</text><text x="755" y="213" text-anchor="middle" class="s">目标与约束靠前</text><text x="755" y="240" text-anchor="middle" class="s">证据按主题分组</text><rect x="900" y="135" width="150" height="130" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="975" y="180" text-anchor="middle" class="h">Token 预算</text><text x="975" y="213" text-anchor="middle" class="s">预留回答空间</text><text x="975" y="240" text-anchor="middle" class="s">超限则压缩</text><path d="M275 200H340M570 200H635M865 200H890" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="120" y="345" width="400" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="320" y="386" text-anchor="middle" class="h">保留：近期关键对话</text><text x="320" y="420" text-anchor="middle" class="s">滚动窗口 + 历史摘要</text><text x="320" y="450" text-anchor="middle" class="s">用户偏好按需检索注入</text><rect x="580" y="345" width="400" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="780" y="386" text-anchor="middle" class="h">检查：信息是否可追溯</text><text x="780" y="420" text-anchor="middle" class="s">保留来源、时间与权限标签</text><text x="780" y="450" text-anchor="middle" class="s">避免摘要丢失关键条件</text><path d="M975 265V310H780V335M645 265V310H320V335" class="a"/><text x="550" y="565" text-anchor="middle" class="s">上下文越长不代表越有效：相关性、顺序与证据质量更关键</text></svg>
