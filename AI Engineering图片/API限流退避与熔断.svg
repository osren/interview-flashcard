<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.h{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.b{rx:17;stroke-width:2}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1100" height="620" rx="28" fill="#f8fafc"/><text x="550" y="55" text-anchor="middle" class="t">API 遇到限流：识别、退避、重试或降级</text><rect x="70" y="160" width="200" height="105" class="b" fill="#eef2ff" stroke="#818cf8"/><text x="170" y="202" text-anchor="middle" class="h">请求返回 429</text><text x="170" y="235" text-anchor="middle" class="s">读取 Retry-After</text><path d="M270 212H340" class="a"/><path d="M440 140L540 212L440 284L340 212Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="440" y="205" text-anchor="middle" class="h">可重试？</text><text x="440" y="232" text-anchor="middle" class="s">幂等且错误可恢复</text><rect x="630" y="110" width="230" height="105" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="745" y="152" text-anchor="middle" class="h">等待后重试</text><text x="745" y="185" text-anchor="middle" class="s">指数退避 + 随机抖动</text><rect x="630" y="310" width="230" height="105" class="b" fill="#fee2e2" stroke="#f87171"/><text x="745" y="352" text-anchor="middle" class="h">停止重试</text><text x="745" y="385" text-anchor="middle" class="s">快速失败并记录原因</text><rect x="900" y="110" width="155" height="105" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="977" y="152" text-anchor="middle" class="h">成功</text><text x="977" y="185" text-anchor="middle" class="s">返回结果</text><rect x="900" y="310" width="155" height="105" class="b" fill="#ede9fe" stroke="#a78bfa"/><text x="977" y="352" text-anchor="middle" class="h">熔断 / 降级</text><text x="977" y="385" text-anchor="middle" class="s">缓存或备用方案</text><path d="M540 190L620 162M540 235L620 362M860 162H890M745 215V300M860 362H890" class="a"/><path d="M900 175C820 40 590 55 520 170" class="a"/><text x="735" y="68" class="s">有限次数</text><rect x="150" y="480" width="800" height="70" rx="15" fill="#e2e8f0"/><text x="550" y="523" text-anchor="middle" class="h">同时控制并发与队列；记录重试次数、等待时间、429 比例和最终结果</text></svg>
