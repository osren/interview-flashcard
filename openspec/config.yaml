schema: spec-driven

context: |
  InterviewFlash is an existing React + TypeScript interview-preparation and job-search application.
  The frontend is built with Vite and uses Tailwind CSS, Zustand, and React Router DOM.
  Supabase is an active managed backend dependency for authentication, user-data sync,
  database migrations, and Edge Functions. Local persistence uses both localStorage and IndexedDB.
  Verify actual behavior and boundaries in src/, supabase/, package.json, and pnpm-lock.yaml;
  do not assume this is a frontend-only or localStorage-only application.
  Keep behavior specifications independent of implementation details; put technical choices in design.md.

# Per-artifact rules can be added when the project develops stable, specific needs.
